appId: com.instrumet.calibration
productName: Instrumet Calibration
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.business
linux:
  target: AppImage
  category: Office
