appId: com.instrumet.calibration
productName: Instrumet Calibration
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
# Installed apps check GitHub Releases for updates (repo is public, so no token
# is built into the app). Releases are published by .github/workflows/release.yml.
publish:
  provider: github
  owner: dathomaster
  repo: instrumet-cal-databse
  releaseType: release
win:
  target: nsis
  artifactName: Instrumet-Calibration-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.business
linux:
  target: AppImage
  category: Office
